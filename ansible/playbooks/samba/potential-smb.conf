#
# Sample configuration file for the Samba suite for Debian GNU/Linux.
# (Debian boilerplate comments trimmed for brevity — see your original
# for the full explanations of homes/printers/domain-logon sections.)
#
# NOTE: run `testparm` after editing to catch syntax errors.

#======================= Global Settings =======================

[global]
	fruit:metadata = stream
	fruit:encoding = native
	fruit:zero_file_id = yes
	fruit:nfs_aces = no
	fruit:aapl = yes
	fruit:posix_rename = yes
	fruit:model = MacSamba
	server string = deb-shares

    # Remove this line if you have clients that need to connect over SMB1/SMB2.
	server max protocol = SMB3
	server min protocol = SMB3
	vfs objects = acl_xattr catia fruit streams_xattr aio_pthread
	map acl inherit = yes

	oplocks = yes
	locking = yes

## Browsing/Identification ###
   workgroup = WORKGROUP

#### Networking ####
;   interfaces = 127.0.0.0/8 eth0
;   bind interfaces only = yes

#### Debugging/Accounting ####
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

####### Authentication #######
   server role = standalone server
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   pam password change = yes
   map to guest = bad user

############ Misc ############
   usershare allow guests = yes

#======================= Share Definitions =======================

[homes]
   comment = Home Directories
   browseable = no
   read only = yes
   create mask = 0700
   directory mask = 0700
   valid users = %S

[printers]
   comment = All Printers
   browseable = no
   path = /var/tmp
   printable = yes
   guest ok = no
   read only = yes
   create mask = 0700

[print$]
   comment = Printer Drivers
   path = /var/lib/samba/printers
   browseable = yes
   read only = yes
   guest ok = no
;   write list = root, @lpadmin

[cody]
	path = /mnt/tank/media/cody
	guest ok = no
	comment = Media files
	browseable = yes
	read only = no

[shared]
	path = /mnt/tank/media/shared
	guest ok = no
	comment = Media files
	browseable = yes
	read only = no

[docker]
	path = /mnt/nvme-thin/docker
	guest ok = no
	comment = Docker configurations
	browseable = yes
	read only = no

[timemachine]
	path = /mnt/tank/timemachine
	guest ok = no
	comment = Macbook backups
	browseable = yes
	read only = no
	ea support = yes
	fruit:time machine = yes

[veeam]
	path = /mnt/tank/veeam
	guest ok = no
	comment = Veeam backups
	browseable = yes
	read only = no
	ea support = yes
	fruit:time machine = yes

[docker-backups]
	path = /srv/backups/docker
	guest ok = no
	comment = Docker app backups
	browseable = yes
	read only = no
	ea support = yes
	fruit:time machine = yes

[emudeck-backups]
	path = /srv/backups/emudeck
	guest ok = no
	comment = Emudeck backups
	browseable = yes
	read only = no
	valid users = cody